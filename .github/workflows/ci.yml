name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep validation runs independent when several small commits are pushed in sequence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the other Python version if one matrix leg fails.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non-blocking)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          python -m pytest tests/ -v -k "not Integration and not real_extraction and not test_count_tables" --tb=short

      - name: Run evaluation suite (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          python evals/run_evaluation.py --ci
